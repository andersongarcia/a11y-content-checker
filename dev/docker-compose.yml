# Local WordPress multisite for testing the plugin.
# Start (from the dev/ folder): docker compose up -d && docker compose run --rm cli sh /scripts/install.sh
name: a11y-content-checker-dev

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports:
      - "127.0.0.1:8888:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/a11y-content-checker
      - ./plugins/elementor:/var/www/html/wp-content/plugins/elementor

  cli:
    image: wordpress:cli
    profiles: [cli]
    user: "33:33"
    depends_on: [db, wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/a11y-content-checker
      - ./plugins/elementor:/var/www/html/wp-content/plugins/elementor
      - ./scripts:/scripts:ro

volumes:
  db:
  wp:
